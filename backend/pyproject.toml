[project]
name = "groww-signal-backend"
version = "0.1.0"
description = "Groww Signal attention-engine API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "asyncpg>=0.30.0",
  "redis>=5.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "numpy>=2.1.0",
  "openai>=1.57.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
